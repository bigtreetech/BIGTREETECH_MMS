#--------------------------- MMS Configuration ---------------------------#
# Multi-color Material Management System for Klipper
# Adapted for Vivid hardware

#--------------------------- Installation Steps ---------------------------#
# 1. Copy config folder:
#    cp -r ~/klipper/config/bigtreetech-mms ~/printer_data/config
# 2. Add to printer.cfg:
#    [include bigtreetech-mms/mms/mms.cfg]
# 3. Set the cutter, tray and brush geometry for the printer, then restart.
# Requires Klipper 938300f or newer and [pause_resume] in the printer config.
# T commands and PAUSE/RESUME recovery are native; do not duplicate their
# loading, retraction or cleaning actions in product macros.
# In an existing PRINT_START, call MMS_CHECK_START before heating or moving.
# During long custom cleaning macros, MMS_CHECK_RUNOUT propagates a runout
# to the active recovery request. No product start/cleaning macro is installed here.

#--------------------------- MCU Configuration ---------------------------#
[mcu buffer]
# canbus_uuid: {The can_id refresh from "DEVICES"}                  # Can connect
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_buffer-if00     # USB connection

[mcu vivid]
# canbus_uuid: {The can_id refresh from "DEVICES"}                  # Can connect
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_vivid-if00      # USB connection

#--------------------------- Temperature Sensors ---------------------------#
[temperature_sensor Buffer_MCU]
sensor_type: temperature_mcu
sensor_mcu: buffer

[temperature_sensor ViViD_MCU]
sensor_type: temperature_mcu
sensor_mcu: vivid

#--------------------------- Module Includes ---------------------------#
[include mms-includes.cfg]

#--------------------------- MMS Main Settings ---------------------------#
[mms]
# Selector, ordinary delivery and autoload: total attempts (minimum 2).
# Measured delivery and buffer references: additional retries.
retry_times:       3
slot:              0,1,2,3                          # Slot numbers (SLOT0 through SLOT3)
selector_name:     manual_stepper selector_stepper  # Selector stepper name
drive_name:        manual_stepper drive_stepper     # Drive stepper name

#--------------------------- Buffer Hardware Pins ---------------------------#
outlet:            buffer:PA5     # Buffer outlet and full sensor
buffer_runout:     buffer:PA4     # Buffer runout sensor
buffer_target_percentage: 50.0  # Shared reserve target, above 0 and below 100
# Normal buffer feed limits; tune to the feeder mechanics.
buffer_max_velocity: 80.0  # mm/s, independent of load/unload
buffer_max_accel: 120.0    # mm/s^2, includes reserve correction
# Preparation and normal feeding use this target. Higher values approach full.

#--------------------------- Dryer heater ---------------------------#
dryer_heater:      ViViD_Dryer    # Check in mms-heater.cfg

#--------------------------- Toolhead Filament Sensors (Optional) ---------------------------#
# If [filament_switch_sensor entry_sensor] is configured elsewhere,
# remove that section to avoid conflicts.
# Enabling entry_sensor in MMS may lower outlet priority.

# entry_sensor:    EBBCan:gpio21
# Optional digital switch below the extruder. See MMS_STATUS.
# On a missing lower signal, RESUME can feed up to fill_extrude_distance.
# exit_sensor: !toolhead:PA0

#--------------------------- Feature Toggles ---------------------------#
filament_detection_enable:    0 # Master switch for runout monitoring
# Known upstream runout before Entry is withdrawn even when endless is off.
# After successful withdrawal, endless=0 pauses for manual refill.
endless_spool_enable:         0 # Master switch for all endless_with_slot links
# With detection=1 and Entry present, Inlet exhaustion records the old tail.
# An accepted loaded tail may continue until the next T or Entry release.
# With endless=0, handling pauses and releases the selector for manual clearing.
# With endless=1, a known pre-Entry runout first attempts bounded unloading;
# a loaded tail is drained when handling starts, then the backup chain is used.
# Automatic endless spool also requires [mms purge] and [mms swap] enable=1.
# Detection=0 disables automatic runout handling, even with endless=1.
# Without Entry, retain the Gate/Outlet and configured runout-distance policy.
# Refilling Inlet or CLEAR_PAUSE does not erase a known exhausted path;
# clear residual filament before reloading.

#--------------------------- MMS Logger Configuration ---------------------------#
[mms logger]
filename:          mms.log        # Base log filename
rotate_when:       midnight       # Log rotation schedule (S, M, H, D, midnight, W{0-6})
backup_count:      5              # Historical logs to retain (0=infinite, not recommended)

#--------------------------- Macros Includes ---------------------------#
[include mms-macros.cfg]
