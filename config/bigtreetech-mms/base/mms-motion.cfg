#--------------------------- MMS Delivery Module Configuration ---------------------------#
[mms delivery]
speed_selector:           150   # Selector stepper speed (mm/s)
accel_selector:           150   # Selector stepper acceleration (mm/s²)
speed_drive:              80    # Drive stepper speed (mm/s)
accel_drive:              40    # Drive stepper acceleration (mm/s²)
# speed_drive / accel_drive configure explicit loading and unloading.
# Normal feed follows E within buffer_max_velocity / buffer_max_accel.
# Remove temporary buffer_feed_margin / buffer_refill_timeout when upgrading.
sprint_speed:             40    # Drive stepper sprint speed (mm/s)
sprint_accel:             120   # Drive stepper sprint acceleration (mm/s²)
bowden_distance:          1000  # Distance before endstop trigger (mm)
safety_retract_distance:  50    # Safety retract distance (mm)
slots_loop_times:         200   # Full-slot rounds for MMS_SLOTS_LOOP / MMS_SLOTS_CHECK_LOOP
slots_rfid_check_loops:   -1    # MMS_SLOTS_CHECK_LOOP: check RFID in first N rounds (-1=all, 0=none)
# RFID checks also require rfid_enable=1 on each slot.

custom_trsync_timeout:    0.05  # Multi-MCU MMS endstop timeout (seconds)

#--------------------------- MMS Autoload Module Configuration ---------------------------#
[mms autoload]
enable:                   1     # Autoload module enable (0=disable, 1=enable)

#--------------------------- MMS Charge Module Configuration ---------------------------#
[mms charge]
z_raise:                  1.0   # Z-axis lift distance during charge (mm)

#--------------------------- Filament Extrusion Settings ---------------------------#
# Retract distance and maximum Entry re-feed per attempt (mm).
sprint_distance:          100.0
# E loading travel. The buffer follows E, stops feed at full and adds feed at low.
# Distance must be >= 0; speed must be > 0.
fill_extrude_distance:     60.0     # Distance of charge extrude (mm)
fill_extrude_speed:        600.0    # Speed of charge extrude (mm/min)

#--------------------------- Custom Macro (Optional) ---------------------------#
# custom_before:          MMS_CHARGE_CUSTOM_BEFORE
# Retried by RESUME after completed feeding; make this hook safe to repeat.
# Feeding is not repeated when only this final acceptance fails.
# custom_after:           MMS_CHARGE_CUSTOM_AFTER

#--------------------------- MMS Eject Module Configuration ---------------------------#
[mms eject]
z_raise:                  1.0   # Z-axis lift distance during eject (mm)

#--------------------------- Filament Retraction Settings ---------------------------#
fast_retract_distance:    8.0      # Fast retraction distance before cut (mm)
fast_retract_speed:       10000.0  # Fast retraction speed before cut (mm)
# Optional synchronized pull before the toolhead lets go of the cutter.
cut_hold_retract_distance: 0.0     # mm; 0 disables the pull
cut_hold_retract_speed:    120.0   # mm/min
retract_distance:         120.0    # Retraction distance (mm)
retract_speed:            600.0    # Retraction speed (mm/min)

#--------------------------- Printing flow ---------------------------#
print_finish_exec:         1   # Execute eject after print finish (0=disable, 1=enable)

#--------------------------- Custom Macro (Optional) ---------------------------#
# custom_before:          MMS_EJECT_CUSTOM_BEFORE
# custom_after:           MMS_EJECT_CUSTOM_AFTER

#--------------------------- MMS Swap Module Configuration ---------------------------#
[mms swap]
enable:                   1     # Swap module enable (0=disable, 1=enable)
z_raise:                  1.0   # Z-axis lift distance during swap (mm)

#--------------------------- Filament Swap Command Configuration ---------------------------#
command_string:           T     # Command string for slot selection (e.g., T0-T3)

#--------------------------- Safe Mode Settings ---------------------------#
safe_mode:                0     # Insert M400 after each G1 move (0=disable, 1=enable)

#--------------------------- Toolhead Movement Speed ---------------------------#
toolhead_move_speed:      24000.0 # Toolhead speed for all swap operations (mm/min)
# Optional maintenance acceleration (mm/s^2); omitted uses printer.max_accel.
# Always capped by printer.max_accel; no machine-specific override is enabled.
# toolhead_move_accel:    <acceleration>

#--------------------------- Custom Macro (Optional) ---------------------------#
# custom_before:          MMS_SWAP_CUSTOM_BEFORE
# custom_after:           MMS_SWAP_CUSTOM_AFTER
