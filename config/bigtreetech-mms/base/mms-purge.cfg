#--------------------------- MMS Purge Module Configuration ---------------------------#
[mms purge]
enable:                  1     # Purge module enable (0=disable, 1=enable)
z_raise:                 1.0   # Z-axis lift distance during purge (mm)

#--------------------------- Cooling Fan Settings ---------------------------#
fan_cooldown_speed:      1.0   # Fan speed during cooldown (0.0-1.0, 0% to 100%)
fan_cooldown_wait:       2.0   # Cooldown duration with fan (seconds)

#--------------------------- Purge Extrusion Settings ---------------------------#
purge_speed:             300.0 # Extruder speed during purging (mm/min)

# Optional ordinary pause/resume extrusion; both distances default to zero.
# Tool-change purge volume continues to use orphan_filament_length * purge_modifier.
# pause_retract_distance: 0.0    # mm; also retracts after ordinary resume purge
# pause_retract_speed:    1800.0 # mm/min; repayment uses repay_speed below
# resume_purge_distance:  0.0    # mm; uses purge_speed
# Extra filament after XY return on ordinary RESUME (mm); uses repay_speed.
resume_extra_extrude_distance: 0.0

# Optional runout clearing limits (mm), used only when automatic endless spool
# is enabled. With Entry, stop when it releases; max distance allows for slip.
# Without Entry, use the fixed runout_distance instead.
# runout_max_distance:    5000.0
# runout_distance:        2000.0
# Optional mechanical pre-clean before charge filling, resume purge, runout
# clearing, standalone purge or a retried swap purge. No E moves; finish at
# tray_point. Runs in the native motion scope; omitted preserves old behavior.
# pre_extrude_gcode:      <pre_clean_and_return_to_tray_macro>
# Optional mechanical wipe/eject after each clearing segment; none by default.
# May run with Entry released. Must not require filament, extrude or retract.
# runout_chunk_gcode:     <waste_tray_macro>

#--------------------------- Orphan Filament Settings ---------------------------#
# Orphan filament: residual segment between cutter and nozzle after cutting.
# This must be purged during subsequent purge process.
#
#     | | Extruder | |
#     | | Stepper  | |
#     | +----------+ |
#  ======> Cutter    | ---
#     |              |  |
#      \            /   | orphan filament
#       \  Nozzle  /    | length
#        \        /     |
#         \______/     ---
#
orphan_filament_length:  60    # Length of orphan filament to purge (mm)
purge_modifier:          2.5   # Multiplier for purge volume calculation

#--------------------------- Retraction Compensation ---------------------------#
retraction_compensation: 3.0   # Prevents underextrusion after purging (mm)
retract_speed:           10000.0 # Retraction speed (mm/min)
# Optional repayment speed (mm/min); omitted follows retract_speed.
# repay_speed:            10000.0

#--------------------------- Purge Tray Configuration ---------------------------#
# Diagram of purge tray layout:
# -------------------------------
# |                             |
# | ------                      |
# | |Tray|                      |
# | | 0  |                      |
# | ------                      |
# |   1                         |
# |                             |
# |                             |
# -------------------------------
axis_first:              Y              # Order to process axis from tray_point. Options: 'X', 'Y', 'XY'.
tray_point:              (100.0, 100.0) # Purge tray location (X/Y)
# eject_point:           (100.0, 80.0)  # Filament eject position (X/Y)

#--------------------------- Custom Macro (Optional) ---------------------------#
# custom_before:         MMS_PURGE_CUSTOM_BEFORE
# custom_after:          MMS_PURGE_CUSTOM_AFTER

#--------------------------- MMS Brush Module Configuration ---------------------------#
[mms brush]
enable:                  1     # Brush module enable (0=disable, 1=enable)
z_raise:                 1.0   # Z-axis lift distance during brush (mm)

#--------------------------- Cooling Fan Settings ---------------------------#
fan_cooldown_speed:      1.0   # Fan speed during cooldown (0.0-1.0, 0% to 100%)
fan_cooldown_wait:       1.0   # Cooldown duration with fan (seconds)
# Optional ordinary resume wait; omitted follows fan_cooldown_wait.
# resume_fan_cooldown_wait: 1.0

#--------------------------- Brush Wiping Configuration ---------------------------#
wipe_points:             (100.0, 100.0), (80.0, 100.0) # Sequential wipe points (X/Y)
wipe_speed:              10000.0 # Wiping movement speed (mm/min)
wipe_times:              5     # Number of wiping passes

#--------------------------- Brush Pecking Configuration ---------------------------#
peck_point:              (100.0, 100.0) # Peck position (X/Y)
peck_speed:              10000.0 # Pecking movement speed (mm/min)
peck_depth:              2.0   # Depth of each peck (mm)
peck_times:              0     # Number of pecking cycles

#--------------------------- Custom Macro (Optional) ---------------------------#
# Optional replacement for the native wipe/peck path; define the macro in the
# printer configuration before enabling. No custom cleaning path by default.
# Runs within MMS motion state and fan cooldown; do not call T/PAUSE/RESUME.
# custom_clean:          <cleaning_macro>
# custom_before:         MMS_BRUSH_CUSTOM_BEFORE
# custom_after:          MMS_BRUSH_CUSTOM_AFTER
