#--------------------------- MMS CUT Module Configuration ---------------------------#
[mms cut]
enable:            1              # Cutter module enable (0=disable, 1=enable)
z_raise:           1.0            # Z-axis lift distance during cutting (mm)
cut_speed:         2000           # Toolhead movement speed during cut (mm/min)

# Optional cutter feedback: omit pin for machines without a sensor.
# Digital input uses normal Klipper pin polarity/pullup syntax (! / ^).
# For an ADC sensor also set the resistance range; pullup defaults to 4700 ohms.
# cutter_sensor_pin: <mcu:pin>
# cutter_sensor_analog_range: <min_ohms>, <max_ohms>
# cutter_sensor_analog_pullup_resistor: 4700
# cutter_sensor_timeout: 0.5
# Migration from cutter_sensor: <button_name>: move that button's pin and ADC
# options here, and remove its old gcode_button section to avoid duplicate pins.
# MMS_STATUS reports the state; ADC sensors remain available via QUERY_ADC.

#--------------------------- Cutting Path Configuration ---------------------------#
# Diagram of cutting path relative to print bed:
# -------------------------------
# |                             |
# |1 <=== 0 (cutting direction) |
# |                             |
# |                             |
# |                             |
# |                             |
# |                             |
# |                             |
# -------------------------------
# 0: cutter_init_point
# 1: cutter_final_point

cutter_init_point:   (100.0, 100.0)     # Starting position of cutting path (X/Y)
cutter_final_point:  (80.0, 100.0)      # Ending position of cutting path (X/Y)
